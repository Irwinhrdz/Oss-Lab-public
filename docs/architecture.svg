<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>OSS Lab — arquitectura y flujo de datos</title>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <style>
    .node-box { stroke-width: 1.6; }
    .node-label { font-size: 16px; font-weight: 600; fill: #1e293b; }
    .node-sub { font-size: 12px; fill: #475569; }
    .edge-label { font-size: 12.5px; fill: #334155; }
    .section-title { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
    .title { font-size: 21px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #475569; }
  </style>

  <text x="550" y="34" class="title" text-anchor="middle">OSS Lab — de la venta a la red</text>
  <text x="550" y="54" class="subtitle" text-anchor="middle">POST /subscribers → valida sitio → aprovisiona core 5G → UE real navegando → NOC vigilando todo</text>

  <!-- ===================== NODES ===================== -->
  <!-- Cliente -->
  <g text-anchor="middle">
    <rect x="30" y="86" width="170" height="60" rx="12" class="node-box" fill="#eef2ff" stroke="#6366f1"/>
    <text x="115" y="111" class="node-label">Cliente</text>
    <text x="115" y="130" class="node-sub">POST /subscribers</text>
  </g>

  <!-- Middleware -->
  <g text-anchor="middle">
    <rect x="365" y="78" width="200" height="76" rx="14" class="node-box" fill="#4f46e5" stroke="#312e81"/>
    <text x="465" y="108" class="node-label" fill="#ffffff">Middleware</text>
    <text x="465" y="128" class="node-sub" fill="#e0e7ff">NestJS · orquesta todo</text>
    <text x="465" y="144" class="node-sub" fill="#e0e7ff">K/OPc nunca en logs</text>
  </g>

  <!-- NetBox -->
  <g text-anchor="middle">
    <rect x="800" y="86" width="190" height="60" rx="12" class="node-box" fill="#ecfeff" stroke="#0891b2"/>
    <text x="895" y="111" class="node-label">NetBox</text>
    <text x="895" y="130" class="node-sub">inventario de sitios</text>
  </g>

  <!-- Mongo / Open5GS subscribers -->
  <g text-anchor="middle">
    <rect x="355" y="268" width="220" height="62" rx="12" class="node-box" fill="#eef2ff" stroke="#6366f1"/>
    <text x="465" y="294" class="node-label" style="font-size:14px">Open5GS · MongoDB</text>
    <text x="465" y="314" class="node-sub">IMSI / K / OPc</text>
  </g>

  <!-- UERANSIM -->
  <g text-anchor="middle">
    <rect x="30" y="470" width="190" height="64" rx="12" class="node-box" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="125" y="496" class="node-label">UERANSIM</text>
    <text x="125" y="516" class="node-sub">gNB + UE simulados</text>
  </g>

  <!-- AMF -->
  <g text-anchor="middle">
    <rect x="330" y="470" width="130" height="64" rx="12" class="node-box" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="395" y="498" class="node-label">AMF</text>
    <text x="395" y="517" class="node-sub">registro</text>
  </g>

  <!-- SMF -->
  <g text-anchor="middle">
    <rect x="550" y="470" width="130" height="64" rx="12" class="node-box" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="615" y="498" class="node-label">SMF</text>
    <text x="615" y="517" class="node-sub">sesión</text>
  </g>

  <!-- UPF -->
  <g text-anchor="middle">
    <rect x="770" y="470" width="130" height="64" rx="12" class="node-box" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="835" y="498" class="node-label">UPF</text>
    <text x="835" y="517" class="node-sub">datos (GTP-U)</text>
  </g>

  <!-- Zabbix -->
  <g id="zabbix-node" text-anchor="middle">
    <rect x="955" y="268" width="150" height="64" rx="12" class="node-box" fill="#fffbeb" stroke="#d97706"/>
    <text x="1030" y="295" class="node-label">Zabbix</text>
    <text x="1030" y="314" class="node-sub">alarmas / NOC</text>
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1;1;1.045;1;1" keyTimes="0;0.4;0.5;0.6;1" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- ===================== EDGES: alta de suscriptor (azul) ===================== -->
  <path d="M200,116 L365,116" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="280" y="104" class="edge-label" text-anchor="middle">alta</text>

  <path d="M565,105 C 690,95 690,95 800,105" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="690" y="88" class="edge-label" text-anchor="middle">valida sitio</text>

  <path d="M465,154 L465,268" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="520" y="214" class="edge-label" text-anchor="middle">provisiona</text>

  <path d="M465,330 C 440,400 420,430 400,468" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrow-blue)" opacity="0.8"/>

  <!-- paquetes animados: alta de suscriptor -->
  <circle r="6" fill="#4f46e5">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M200,116 L565,108 C 690,96 690,96 800,105"/>
  </circle>
  <circle r="6" fill="#4f46e5">
    <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M465,160 L465,268 L465,330 C 440,400 420,430 400,468"/>
  </circle>

  <!-- ===================== EDGES: flujo de radio/datos (teal) ===================== -->
  <path d="M220,502 L330,502" fill="none" stroke="#0d9488" stroke-width="2.4" marker-end="url(#arrow-teal)"/>
  <text x="275" y="490" class="edge-label" text-anchor="middle">NGAP</text>

  <path d="M460,502 L550,502" fill="none" stroke="#0d9488" stroke-width="2.4" marker-end="url(#arrow-teal)"/>
  <text x="505" y="490" class="edge-label" text-anchor="middle">N4</text>

  <path d="M680,502 L770,502" fill="none" stroke="#0d9488" stroke-width="2.4" marker-end="url(#arrow-teal)"/>
  <text x="725" y="490" class="edge-label" text-anchor="middle">GTP-U</text>

  <circle r="6" fill="#0d9488">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M220,502 L330,502 L460,502 L550,502 L680,502 L770,502 L900,502"/>
  </circle>

  <!-- ===================== EDGES: monitoreo Zabbix (ambar, discontinuo) ===================== -->
  <path d="M955,285 C 760,210 600,140 468,80" fill="none" stroke="#d97706" stroke-width="1.6"
    stroke-dasharray="6 6" marker-end="url(#arrow-amber)" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <path d="M980,332 C 780,420 600,450 397,470" fill="none" stroke="#d97706" stroke-width="1.6"
    stroke-dasharray="6 6" marker-end="url(#arrow-amber)" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <path d="M955,300 C 700,420 450,460 125,470" fill="none" stroke="#d97706" stroke-width="1.6"
    stroke-dasharray="6 6" marker-end="url(#arrow-amber)" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <!-- ===================== LEYENDA ===================== -->
  <g transform="translate(30,590)">
    <rect x="0" y="0" width="1040" height="94" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="18" y="22" class="section-title" text-anchor="start" fill="#0f172a">LEYENDA</text>

    <line x1="18" y1="44" x2="60" y2="44" stroke="#4f46e5" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
    <text x="70" y="48" class="edge-label" text-anchor="start">Alta de suscriptor — Middleware ⇄ NetBox ⇄ Open5GS (MongoDB)</text>

    <line x1="18" y1="66" x2="60" y2="66" stroke="#0d9488" stroke-width="2.4" marker-end="url(#arrow-teal)"/>
    <text x="70" y="70" class="edge-label" text-anchor="start">Radio y datos reales — UERANSIM → AMF → SMF → UPF (3GPP)</text>

    <line x1="550" y1="44" x2="592" y2="44" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 5"/>
    <text x="602" y="48" class="edge-label" text-anchor="start">Vigilancia Zabbix — procesos del core, gNB y /health del middleware</text>

    <text x="550" y="70" class="edge-label" text-anchor="start" fill="#475569">GET /topology combina inventario + rendimiento + fallas en un solo grafo (modelo FCAPS)</text>
  </g>
</svg>
